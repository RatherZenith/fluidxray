# Gradle JVM options. Minecraft 1.21.1 decompilation needs a fair amount of heap.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# If Gradle cannot find a JDK 21 automatically, uncomment and point this at your JDK 21 install.
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-21

# Better Minecraft parameter names / javadoc for the decompiled sources.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.259
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

# Mod
mod_id=fluidxray
mod_name=Fluid X-ray
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.ratherzenith
